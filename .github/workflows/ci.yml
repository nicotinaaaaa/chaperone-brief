name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to match the Node version this project is developed and
          # deployed with (see README) — avoids CI passing or failing on a
          # different Node behaviour than the one that actually ships.
          node-version: "24.21.0"
          cache: "npm"

      - run: npm ci

      - name: Type-check and validate content schemas
        run: npx astro check

      - name: Build (fails on any broken content or schema violation)
        run: npm run build
